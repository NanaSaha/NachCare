<main class="activation-shell">
  <h1>{{ 'activation.title' | translate }}</h1>
  <p class="intro">{{ 'activation.intro' | translate }}</p>

  <label>
    {{ 'activation.codeLabel' | translate }}
    <input
      type="text"
      inputmode="text"
      autocapitalize="characters"
      [ngModel]="code()"
      (ngModelChange)="code.set($event.toUpperCase())"
      data-testid="activation-code-input"
    />
  </label>

  @if (error()) {
    <p class="error" role="alert">{{ error() | translate }}</p>
  }

  <button type="button" [disabled]="code().replace(' ', '').length < 8 || submitting()" (click)="submit()" data-testid="activate-button">
    {{ (submitting() ? 'activation.activating' : 'activation.activate') | translate }}
  </button>
</main>
