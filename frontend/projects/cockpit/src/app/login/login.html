<main class="login-shell">
  <div class="login-card">
    <p class="login-brand">NachCare<span class="login-brand-accent">AI</span></p>
    <h1>{{ 'auth.title' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        {{ 'auth.email' | translate }}
        <input type="email" formControlName="email" autocomplete="username" />
      </label>

      <label>
        {{ 'auth.password' | translate }}
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      <label>
        {{ 'auth.otpAttempt' | translate }}
        <input type="text" inputmode="numeric" formControlName="otpAttempt" autocomplete="one-time-code" />
      </label>

      @if (error()) {
        <p class="error" role="alert">{{ error() | translate }}</p>
      }

      <button type="submit" [disabled]="form.invalid || submitting()">
        {{ (submitting() ? 'auth.signingIn' : 'auth.signIn') | translate }}
      </button>
    </form>
  </div>
</main>
