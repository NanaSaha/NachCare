<section class="emergency-block" role="alert" data-testid="emergency-block">
  <div class="emergency-block__heading">
    <svg class="emergency-block__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4.6c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
        fill="currentColor"
      />
    </svg>
    <p class="emergency-block__title">{{ 'emergencyBlock.title' | translate }}</p>
  </div>
  <a class="emergency-block__call" href="tel:112" data-testid="emergency-call-link">
    {{ 'emergencyBlock.call' | translate }}
  </a>
  <p class="emergency-block__note">{{ 'emergencyBlock.note' | translate }}</p>
</section>
