# Deterministic keyword lists for Domain::Ai::Guardrails::KeywordPreRouter
# (medication/dosage short-circuit, no LLM call needed — Section 6 #4) and
# for Domain::Ai::Providers::StubProvider's rule-based classification.
#
# These are ordinary multilingual vocabulary (generic words like
# "medication", "dose", "diagnosis", common prompt-injection phrasing) —
# not clinical thresholds, alert copy, or dosing guidance, so this is an
# engineering artifact per ADR-0007, not an OPEN_CLINICAL_ITEMS entry.
# Non-English lists are machine-drafted for recall (favor catching too
# much over missing a real medication question) and should be
# native-reviewed before clinical launch — same caveat as OPEN_DECISIONS
# #2 (DE translation review).
