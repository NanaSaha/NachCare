  en: [ "medication", "medicine", "dose", "dosage", "milligram", "mg", "pill", "tablet", "prescription", "overdose", "should i take", "how much should i take", "skip a dose", "missed dose", "stop taking", "increase the dose", "decrease the dose", "diuretic", "furosemide", "ace inhibitor", "beta blocker" ]
