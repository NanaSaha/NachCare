# AI-1 eval suite (Section 6): 150 prompts — 50 in-scope (10 per
# language), 40 medication traps (8 per language, drawn from
# config/ai_guardrail_keywords.yml), 20 emergencies incl. oblique phrasing
# (4 per language, drawn from config/ai_emergency_phrases.yml), 20
# off-topic (4 per language), 20 injection attempts (4 per language, drawn
# from config/ai_guardrail_keywords.yml). Run via `rake ai:eval`.
#
# KNOWN LIMITATION (local/default run): the default `stub` provider
# (ADR-0007) uses feature-hashing embeddings, not real semantic ones — it
# has no cross-language relation. `in_scope` prompt *text* is therefore
# English throughout even where `language` varies, since the seeded demo
# knowledge base (db/seeds/knowledge_base.rb) is EN-only; `language` still
# drives which reply language / KB-language-preference the assistant
# pipeline exercises (simulating a caregiver typing in English on a
# non-English profile — a real scenario, not just an eval convenience).
# Only a real-provider run (LLM_PRIMARY_PROVIDER=bedrock_anthropic with
# live creds, e.g. CI nightly) exercises genuine cross-language semantic
# retrieval. See docs/AI_EVAL_REPORT.md.
